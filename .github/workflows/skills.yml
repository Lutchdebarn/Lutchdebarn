name: skills dashboard

on:
  push:
    branches: [main]
    paths:
      - skills.conf
      - scripts/gen-skills.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Lint du script
        run: shellcheck scripts/gen-skills.sh

      - name: Génère assets/skills.svg
        run: ./scripts/gen-skills.sh

      - name: Vérifie que le SVG est du XML valide
        run: python3 -c "import xml.dom.minidom as m; m.parse('assets/skills.svg')"

      - name: Commit si le panneau a changé
        run: |
          if git diff --quiet -- assets/skills.svg; then
            echo "skills.svg à jour"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skills.svg
          git commit -m "chore(skills): regenerate dashboard"
          git push
